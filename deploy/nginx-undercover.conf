map $http_upgrade $undercover_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name undercover.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name undercover.example.com;

    ssl_certificate /etc/letsencrypt/live/undercover.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/undercover.example.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $undercover_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
