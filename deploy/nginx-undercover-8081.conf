# Example UNDERCOVER server block for a VPS that already routes this game on 8081.
# If public, terminate HTTPS in front of this listener or adapt this block for TLS.
server {
    listen 8081;
    server_name 8.213.86.128;
    client_max_body_size 1m;

    location ^~ /undercover-assets/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $http_host;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $http_host;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }
}
